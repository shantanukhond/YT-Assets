apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-worker
  namespace: superset
  labels:
    app: superset-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset-worker
  template:
    metadata:
      labels:
        app: superset-worker
    spec:
      containers:
        - name: worker
          image: apache/superset:6.0.0
          securityContext:
            runAsUser: 0
          env:
            - name: SUPERSET_CONFIG_PATH
              value: /app/pythonpath/superset_config.py
            - name: DATABASE_DIALECT
              value: postgresql
            - name: SUPERSET_ENV
              value: production
          envFrom:
            - secretRef:
                name: superset-secrets
          volumeMounts:
            - name: config
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
            - name: bootstrap
              mountPath: /app/docker/docker-bootstrap.sh
              subPath: docker-bootstrap.sh
          command:
            - /bin/sh
            - -c
            - /app/docker/docker-bootstrap.sh worker
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: superset-config
        - name: bootstrap
          configMap:
            name: superset-bootstrap
            defaultMode: 0755
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: superset-worker
  namespace: superset
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: superset-worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
