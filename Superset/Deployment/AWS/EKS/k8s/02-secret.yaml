# Fill values from: terraform output -json / aws secretsmanager get-secret-value
# Or run: ../scripts/create-k8s-secret.sh
apiVersion: v1
kind: Secret
metadata:
  name: superset-secrets
  namespace: superset
type: Opaque
stringData:
  SUPERSET_SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  SUPERSET_ADMIN_PASSWORD: "REPLACE_ME"
  SUPERSET_ADMIN_USERNAME: "admin"
  SUPERSET_ADMIN_EMAIL: "admin@example.com"
