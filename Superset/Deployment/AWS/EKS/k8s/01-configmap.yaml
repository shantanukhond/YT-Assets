apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: superset
data:
  # Keep in sync with ../docker/superset_config.py
  # Or: kubectl create configmap superset-config --from-file=superset_config.py=../docker/superset_config.py -n superset --dry-run=client -o yaml
  superset_config.py: |
    import os

    SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]
    SQLALCHEMY_DATABASE_URI = os.environ["DATABASE_URL"]
    REDIS_URL = os.environ["REDIS_URL"]


    class CeleryConfig:
        broker_url = REDIS_URL
        result_backend = REDIS_URL
        worker_prefetch_multiplier = 1
        task_acks_late = False


    CELERY_CONFIG = CeleryConfig

    CACHE_CONFIG = {
        "CACHE_TYPE": "RedisCache",
        "CACHE_DEFAULT_TIMEOUT": 300,
        "CACHE_KEY_PREFIX": "superset_",
        "CACHE_REDIS_URL": REDIS_URL,
    }

    DATA_CACHE_CONFIG = CACHE_CONFIG

    ENABLE_PROXY_FIX = True
    PROXY_FIX_CONFIG = {
        "x_for": 1,
        "x_proto": 1,
        "x_host": 1,
        "x_port": 1,
        "x_prefix": 1,
    }

    PREFERRED_URL_SCHEME = "https"
    ENABLE_CORS = False

    FEATURE_FLAGS = {
        "ALERT_REPORTS": True,
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-bootstrap
  namespace: superset
data:
  # Keep in sync with ../docker/docker-bootstrap.sh (copied from apache/superset tag 6.0.0)
  # Or: kubectl create configmap superset-bootstrap --from-file=docker-bootstrap.sh=../docker/docker-bootstrap.sh -n superset --dry-run=client -o yaml
  docker-bootstrap.sh: |
    #!/usr/bin/env bash
    set -eo pipefail

    # Make python interactive
    if [ "$DEV_MODE" == "true" ]; then
      if [ "$(whoami)" = "root" ] && command -v uv > /dev/null 2>&1; then
        echo "Reinstalling the app in editable mode"
        uv pip install -e .
      fi
    fi
    REQUIREMENTS_LOCAL="/app/docker/requirements-local.txt"
    PORT=${PORT:-8088}
    # If Cypress run – overwrite the password for admin and export env variables
    if [ "$CYPRESS_CONFIG" == "true" ]; then
      export SUPERSET_TESTENV=true
      export POSTGRES_DB=superset_cypress
      export SUPERSET__SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@db:5432/superset_cypress
      PORT=8081
    fi
    if [[ "$DATABASE_DIALECT" == postgres* ]] && [ "$(whoami)" = "root" ]; then
      # older images may not have the postgres dev requirements installed
      echo "Installing postgres requirements"
      if command -v uv > /dev/null 2>&1; then
        # Use uv in newer images
        uv pip install -e .[postgres]
      else
        # Use pip in older images
        pip install -e .[postgres]
      fi
    fi
    #
    # Make sure we have dev requirements installed
    #
    if [ -f "${REQUIREMENTS_LOCAL}" ]; then
      echo "Installing local overrides at ${REQUIREMENTS_LOCAL}"
      if command -v uv > /dev/null 2>&1; then
        uv pip install --no-cache-dir -r "${REQUIREMENTS_LOCAL}"
      else
        pip install --no-cache-dir -r "${REQUIREMENTS_LOCAL}"
      fi
    else
      echo "Skipping local overrides"
    fi

    case "${1}" in
      worker)
        echo "Starting Celery worker..."
        # setting up only 2 workers by default to contain memory usage in dev environments
        celery --app=superset.tasks.celery_app:app worker -O fair -l INFO --concurrency=${CELERYD_CONCURRENCY:-2}
        ;;
      beat)
        echo "Starting Celery beat..."
        rm -f /tmp/celerybeat.pid
        celery --app=superset.tasks.celery_app:app beat --pidfile /tmp/celerybeat.pid -l INFO -s "${SUPERSET_HOME}"/celerybeat-schedule
        ;;
      app)
        echo "Starting web app (using development server)..."
        flask run -p $PORT --with-threads --reload --debugger --host=0.0.0.0
        ;;
      app-gunicorn)
        echo "Starting web app..."
        /usr/bin/run-server.sh
        ;;
      *)
        echo "Unknown Operation!!!"
        ;;
    esac
